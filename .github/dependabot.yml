version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"

    open-pull-requests-limit: 10

    labels:
      - dependencies

    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"

    labels:
      - github-actions

    commit-message:
      prefix: "ci"
